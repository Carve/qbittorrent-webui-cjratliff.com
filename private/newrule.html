<!DOCTYPE html>
<html lang="${LANG}">

<head>
    <meta charset="UTF-8">
    <title>New rule name</title>
    <link rel="stylesheet" href="css/style.css?v=${CACHEID}" type="text/css">
    <script defer src="scripts/localpreferences.js?v=${CACHEID}"></script>
    <script defer src="scripts/color-scheme.js?v=${CACHEID}"></script>
    <script src="scripts/misc.js?locale=${LANG}&v=${CACHEID}"></script>
    <script>
        "use strict";

        new Keyboard({
            defaultEventType: "keydown",
            events: {
                "Enter": (event) => {
                    $("submitButton").click();
                    event.preventDefault();
                },
                "Escape": (event) => {
                    window.parent.MochaUI.closeWindow(window.parent.$("newRulePage"));
                    event.preventDefault();
                },
                "Esc": (event) => {
                    window.parent.MochaUI.closeWindow(window.parent.$("newRulePage"));
                    event.preventDefault();
                }
            }
        }).activate();
        window.addEventListener("DOMContentLoaded", () => {
            $("name").focus();
            $("submitButton").addEventListener("click", (e) => {
                e.preventDefault();
                e.stopPropagation();

                // check field
                const name = $("name").value.trim();
                if (name === "") {
                    alert("Name cannot be empty");
                    return;
                }
                $("submitButton").disabled = true;
                new Request({
                    url: "api/v2/rss/setRule",
                    method: "post",
                    data: {
                        ruleName: name,
                        ruleDef: "{}"
                    },
                    onSuccess: (response) => {
                        window.parent.qBittorrent.RssDownloader.updateRulesList();
                        window.parent.MochaUI.closeWindow(window.parent.$("newRulePage"));
                    }
                }).send();
            });
        });
    </script>
</head>

<body>
    <div style="padding: 10px 10px 0px 10px;">
        <label for="name">Please type the name of the new download rule.</label>
        <input type="text" id="name" style="width: 320px;">
        <div style="text-align: center; padding-top: 10px;">
            <input type="button" value="OK" id="submitButton">
        </div>
    </div>
</body>

</html>
