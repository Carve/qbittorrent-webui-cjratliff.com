<!DOCTYPE html>
<html lang="${LANG}" class="dark">

<head>
    <meta charset="UTF-8">
    <title>Add Peers</title>
    <link rel="stylesheet" href="css/style.css?v=${CACHEID}" type="text/css">
    <script defer src="scripts/localpreferences.js?v=${CACHEID}"></script>
    <script defer src="scripts/color-scheme.js?v=${CACHEID}"></script>
    <script>
        "use strict";

        window.addEventListener("DOMContentLoaded", (event) => {
            window.addEventListener("keydown", (event) => {
                switch (event.key) {
                    case "Escape":
                        event.preventDefault();
                        window.parent.qBittorrent.Client.closeFrameWindow(window);
                        break;
                }
            });

            const hash = new URLSearchParams(window.location.search).get("hash");
            if (hash === null)
                return;

            document.getElementById("peers").focus();

            document.getElementById("addPeersOk").addEventListener("click", (e) => {
                e.preventDefault();
                e.stopPropagation();

                const peers = document.getElementById("peers").value.trim().split(/[\r\n]+/);
                if (peers.length === 0)
                    return;

                fetch("api/v2/torrents/addPeers", {
                        method: "POST",
                        body: new URLSearchParams({
                            hashes: hash,
                            peers: peers.join("|")
                        })
                    })
                    .then((response) => {
                        if (!response.ok) {
                            alert("Unable to add peers. Please ensure you are adhering to the IP:port format.");
                            return;
                        }

                        window.parent.qBittorrent.Client.closeFrameWindow(window);
                    });
            });
        });
    </script>
</head>

<body>
    <div style="padding: 10px 10px 0px 10px;">
        <label for="peers">QBT_TR(List of peers to add (one IP per line):)QBT_TR[CONTEXT=PeersAdditionDialog]</label>
        <textarea id="peers" rows="10" style="width: 100%;" placeholder="Format: IPv4:port / [IPv6]:port"></textarea>
        <div style="margin-top: 10px; text-align: center;">
            <button type="button" onclick="parent.qBittorrent.Client.closeFrameWindow(window);">Cancel</button>
            <button type="button" id="addPeersOk">Ok</button>
        </div>
    </div>
</body>

</html>
