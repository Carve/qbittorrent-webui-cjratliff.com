<!DOCTYPE html>
<html lang="${LANG}">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex">
    <title>qBittorrent Web UI</title>
    <link rel="icon" type="image/png" href="images/qbittorrent32.png" />
    <link rel="icon" type="image/svg+xml" href="images/qbittorrent-tray.svg" />
    <link rel="stylesheet" type="text/css" href="css/login.css?v=${CACHEID}" />
    <noscript>
        <link rel="stylesheet" type="text/css" href="css/noscript.css?v=${CACHEID}" />
    </noscript>
    <script src="scripts/login.js?locale=${LANG}&v=${CACHEID}"></script>
</head>

<body>
    <noscript id="noscript">
        <h1>JavaScript Required! You must enable JavaScript for the Web UI to work properly</h1>
    </noscript>
    <div id="loginContainer">
        <div id="loginCard">
            <div id="headerWrapper">
                <img src="images/qbittorrent-tray.svg" alt="qBittorrent logo" id="logo" />
                <h1>qBittorrent Web UI</h1>
            </div>
            <form id="loginform">
                <div class="formGroup">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Enter username" autocomplete="username" autocapitalize="none" autofocus required />
                </div>
                <div class="formGroup">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter password" autocomplete="current-password" required />
                </div>
                <button type="submit" id="loginButton" class="loginBtn">Login</button>
            </form>
            <div id="error_msg"></div>
        </div>
    </div>
</body>

</html>
